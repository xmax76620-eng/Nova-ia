
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<title>NOVA AI — Intelligence artificielle</title>
<style>
:root{--bg:#080d18;--panel:#0d1525;--panel2:#111c30;--line:#273650;--text:#edf3ff;--muted:#91a0b8;--a:#7659ff;--b:#3478ec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,select,textarea{font:inherit}button{cursor:pointer;color:inherit}
.app{height:100dvh;display:grid;grid-template-columns:270px minmax(0,1fr);overflow:hidden}
aside{background:#0b1220;border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column;min-height:0}
.brand{font-size:23px;font-weight:800;margin:5px 0 28px}
.logo{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--a),#20c8c8);margin-right:8px}
.primary,.send{border:0;background:linear-gradient(120deg,var(--a),var(--b));font-weight:700;border-radius:12px;padding:13px}
.primary{width:100%}
.side-label{color:var(--muted);font-size:11px;letter-spacing:1.2px;margin:25px 0 9px}
#history{overflow:auto;display:grid;gap:7px}
.history-entry{display:flex;gap:5px;min-width:0}
.history-item{flex:1;min-width:0;border:1px solid transparent;background:transparent;text-align:left;padding:11px;border-radius:10px;color:#bdc9dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-item.active,.history-item:hover{background:var(--panel2);border-color:var(--line)}
.delete-thread{border:0;background:transparent;color:var(--muted);border-radius:8px;padding:5px 9px}
.side-bottom{margin-top:auto;color:var(--muted);font-size:12px;line-height:1.6}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
header{height:72px;flex-shrink:0;padding:12px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px;background:rgba(8,13,24,.96)}
.head-left{display:flex;align-items:center;gap:12px;min-width:0}
.head-title{font-weight:800}.head-sub{color:var(--muted);font-size:13px;margin-top:4px}
select{max-width:min(58%,430px);min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:11px}
#messages{flex:1;overflow:auto;padding:28px 18px 35px;scroll-behavior:smooth}
.welcome{max-width:720px;margin:10vh auto;text-align:center}
.orb{width:76px;height:76px;margin:auto;border-radius:25px;background:linear-gradient(135deg,var(--a),#20c8c8);display:grid;place-items:center;font-size:34px;box-shadow:0 0 55px #7659ff55}
.welcome h1{font-size:clamp(25px,4vw,36px);margin:25px 0 10px}.welcome p{color:var(--muted)}
.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:26px}
.suggestions button{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:10px 14px;color:#c7d2e5}
.msg{display:flex;gap:13px;max-width:900px;margin:0 auto 25px;align-items:flex-start}
.avatar{width:36px;height:36px;flex:0 0 36px;border-radius:11px;background:#263650;display:grid;place-items:center;font-weight:700}
.assistant .avatar{background:linear-gradient(135deg,#5844c9,#1e9da5)}
.message-content{min-width:0;flex:1}.bubble{overflow-wrap:anywhere;line-height:1.75;padding:5px 0;min-width:0}
.user .bubble{background:#17243a;border:1px solid #2c3e5c;border-radius:14px;padding:13px 15px}
.bubble p{margin:0 0 13px}.bubble h1,.bubble h2,.bubble h3{line-height:1.3;margin:22px 0 10px}
.bubble ul,.bubble ol{padding-left:23px}.bubble strong{color:white}
.code-wrap{margin:14px 0;background:#080e1a;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.code-head{display:flex;justify-content:space-between;padding:8px 12px;background:#111c30;color:var(--muted);font-size:12px}
.code-head button,.msg-actions button{background:transparent;border:1px solid var(--line);border-radius:7px;padding:6px 9px;color:var(--muted);font-size:11px}
pre{overflow:auto;margin:0;padding:15px;white-space:pre;line-height:1.55;font-size:13px}
code{background:#19263d;padding:2px 5px;border-radius:5px}pre code{background:transparent}
.msg-actions{display:flex;gap:7px;margin-top:8px}
.compose{padding:14px max(14px,calc((100% - 900px)/2));border-top:1px solid var(--line);background:#0b1220}
.toolbar{max-width:900px;margin:0 auto 9px;display:flex;justify-content:flex-end;gap:8px}
.tiny{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:9px;padding:7px 10px;font-size:12px}
.status{max-width:900px;margin:0 auto 12px;color:var(--muted);font-size:12px}
form{max-width:900px;margin:auto;display:flex;gap:10px;align-items:flex-end;background:#101827;border:1px solid #34425d;border-radius:18px;padding:10px}
textarea{flex:1;resize:none;background:transparent;border:0;outline:0;color:white;padding:11px;font:16px/1.5 inherit;min-height:48px;max-height:160px;min-width:0}
.send{width:54px;height:50px;flex-shrink:0;font-size:22px}.send:disabled{opacity:.5;cursor:wait}
.hint{text-align:center;color:#71819c;font-size:11px;margin:9px 0 0}
#imagePreview{max-width:900px;margin:8px auto 0;display:flex;flex-wrap:wrap;gap:8px}
.preview-item{position:relative}.preview-image{width:65px;height:65px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.remove-image{position:absolute;top:-6px;right:-6px;border:0;background:#d93650;color:white;border-radius:50%;width:22px;height:22px}
.attached-image{max-width:min(220px,100%);max-height:220px;object-fit:contain;border-radius:12px;display:block;margin-top:8px}
.mobile-menu{display:none}#overlay{display:none}
@media(max-width:700px){
.app{display:block}aside{display:flex;position:fixed;z-index:20;top:0;bottom:0;left:0;width:min(300px,85vw);transform:translateX(-105%);transition:transform .2s}
aside.open{transform:translateX(0)}
#overlay{display:block;position:fixed;inset:0;background:#0009;z-index:19;opacity:0;pointer-events:none}
#overlay.visible{opacity:1;pointer-events:auto}
main{height:100dvh}header{height:68px;padding:10px 12px}
.mobile-menu{display:block;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 11px}
.head-sub{font-size:11px}select{max-width:55%;font-size:12px;padding:10px 7px}
#messages{padding:18px 13px 25px}.msg{gap:9px}
.compose{padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
.send{height:48px;width:50px}.hint{font-size:10px}#imagePreview{padding:0 4px}
}
</style>
</head>
<body>
<div id="overlay"></div>
<div class="app">
<aside id="sidebar">
<div class="brand"><span class="logo">N</span>NOVA AI</div>
<button class="primary" id="new">＋ Nouvelle conversation</button>
<div class="side-label">HISTORIQUE</div>
<div id="history"></div>
<div class="side-bottom">NOVA AI<br>Réfléchir · créer · apprendre<br><br>Historique enregistré sur cet appareil.</div>
</aside>
<main>
<header>
<div class="head-left">
<button class="mobile-menu" id="menu" aria-label="Ouvrir le menu">☰</button>
<div><div class="head-title">NOVA AI</div><div class="head-sub">Votre espace intelligent</div></div>
</div>
<select id="model" aria-label="Choisir un modèle"><option value="">Chargement des modèles…</option></select>
</header>
<section id="messages">
<div class="welcome" id="welcome">
<div class="orb">✦</div><h1>Que veux-tu créer aujourd'hui ?</h1>
<p>Pose une question, imagine un projet ou demande de l'aide.</p>
<div class="suggestions">
<button data-prompt="Explique-moi un sujet compliqué simplement.">Apprendre</button>
<button data-prompt="Aide-moi à imaginer un projet original et détaillé.">Créer un projet</button>
<button data-prompt="Aide-moi à écrire un texte professionnel.">Rédiger</button>
</div></div></section>
<div class="compose">
<div class="toolbar"><button class="tiny" id="clear">Effacer la conversation</button></div>
<div class="status" id="status" aria-live="polite"></div>
<form id="form">
<input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
<button type="button" class="tiny" id="attach" aria-label="Ajouter une photo">📎</button>
<textarea id="input" rows="1" placeholder="Écris ton message à NOVA AI…"></textarea>
<button class="send" id="send" type="submit" aria-label="Envoyer">➤</button>
</form>
<div id="imagePreview"></div>
<div class="hint">Modèles gratuits uniquement · Une IA peut se tromper.</div>
</div>
</main></div>
<script>
const $=id=>document.getElementById(id);
const STORAGE_KEY="nova_threads";
let messages=[],busy=false,threads=[],threadId=null,pendingImages=[];

function welcome(){return `<div class="welcome" id="welcome"><div class="orb">✦</div><h1>Que veux-tu créer aujourd'hui ?</h1><p>Pose une question, imagine un projet ou demande de l'aide.</p><div class="suggestions"><button data-prompt="Explique-moi un sujet compliqué simplement.">Apprendre</button><button data-prompt="Aide-moi à imaginer un projet original et détaillé.">Créer un projet</button><button data-prompt="Aide-moi à écrire un texte professionnel.">Rédiger</button></div></div>`}
function escapeHTML(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function renderMarkdown(source){
const blocks=[];let s=String(source??"").replace(/\r\n/g,"\n");
s=s.replace(/```([\w-]*)\n([\s\S]*?)```/g,(_,lang,code)=>{let i=blocks.length;blocks.push({lang:lang||"Code",code});return `\n%%CODE${i}%%\n`});
s=escapeHTML(s).replace(/^### (.+)$/gm,"<h3>$1</h3>").replace(/^## (.+)$/gm,"<h2>$1</h2>").replace(/^# (.+)$/gm,"<h1>$1</h1>").replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>").replace(/`([^`\n]+)`/g,"<code>$1</code>");
let html="",list="";
function close(){if(list){html+=`</${list}>`;list=""}}
for(const line of s.split("\n")){
const u=line.match(/^\s*[-•] (.+)$/),o=line.match(/^\s*\d+[.)] (.+)$/);
if(u||o){let type=u?"ul":"ol";if(list!==type){close();list=type;html+=`<${type}>`}html+=`<li>${(u||o)[1]}</li>`;continue}
close();let cm=line.match(/^%%CODE(\d+)%%$/);
if(cm){let b=blocks[+cm[1]];html+=`<div class="code-wrap"><div class="code-head"><span>${escapeHTML(b.lang)}</span><button type="button" data-copy-code="${+cm[1]}">Copier le code</button></div><pre><code>${escapeHTML(b.code)}</code></pre></div>`}
else if(/^<h[1-3]>/.test(line))html+=line;else if(line.trim())html+=`<p>${line}</p>`;
}
close();return html;
}
async function copyText(text,button){try{await navigator.clipboard.writeText(text);button.textContent="Copié ✓";setTimeout(()=>button.textContent="Copier",1500)}catch(e){$("status").textContent="Copie impossible sur ce navigateur."}}
function addMessage(role,content){
const row=document.createElement("div");row.className="msg "+role;
const avatar=document.createElement("div");avatar.className="avatar";avatar.textContent=role==="user"?"P":"N";
const area=document.createElement("div");area.className="message-content";
const bubble=document.createElement("div");bubble.className="bubble";
if(role==="assistant")bubble.innerHTML=renderMarkdown(content);else bubble.textContent=content;
area.append(bubble);
if(role==="assistant"&&content!=="NOVA réfléchit…"){const actions=document.createElement("div");actions.className="msg-actions";const copy=document.createElement("button");copy.textContent="Copier la réponse";copy.onclick=()=>copyText(content,copy);actions.append(copy);area.append(actions)}
row.append(avatar,area);$("messages").append(row);$("messages").scrollTop=$("messages").scrollHeight;return bubble;
}
function safeStoredMessages(){
return messages.map(m=>({role:m.role,content:Array.isArray(m.content)?m.content.map(p=>p.type==="text"?p:{type:"text",text:"[Photo envoyée — image non conservée après rechargement]" }):m.content}));
}
function saveThread(){
if(!messages.length||!threadId)return;
let t=threads.find(x=>x.id===threadId);
if(!t){let first=messages.find(m=>m.role==="user");let title=typeof first?.content==="string"?first.content:"Nouvelle conversation";t={id:threadId,title:title.slice(0,45)||"Nouvelle conversation",messages:[]};threads.unshift(t)}
t.messages=safeStoredMessages();t.updatedAt=Date.now();threads.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));threads=threads.slice(0,50);
try{localStorage.setItem(STORAGE_KEY,JSON.stringify(threads))}catch(e){$("status").textContent="Stockage local plein."}
renderHistory();
}
function renderHistory(){
$("history").innerHTML="";
threads.forEach(t=>{const entry=document.createElement("div");entry.className="history-entry";const open=document.createElement("button");open.className="history-item"+(t.id===threadId?" active":"");open.textContent=t.title||"Conversation";open.onclick=()=>{openThread(t.id);closeSidebar()};const del=document.createElement("button");del.className="delete-thread";del.textContent="×";del.onclick=()=>deleteThread(t.id);entry.append(open,del);$("history").append(entry)});
}
function openThread(id){if(busy)return;const t=threads.find(x=>x.id===id);if(!t)return;threadId=id;messages=t.messages.slice();$("messages").innerHTML="";messages.forEach(m=>addMessage(m.role,typeof m.content==="string"?m.content:"[Photo envoyée]"));$("status").textContent="Conversation restaurée. Les photos précédentes ne sont pas conservées.";renderHistory()}
function newThread(){if(busy)return;messages=[];pendingImages=[];renderImagePreview();threadId=null;$("messages").innerHTML=welcome();$("status").textContent="";renderHistory()}
function deleteThread(id){if(busy)return;threads=threads.filter(t=>t.id!==id);localStorage.setItem(STORAGE_KEY,JSON.stringify(threads));if(threadId===id)newThread();renderHistory()}
function openSidebar(){$("sidebar").classList.add("open");$("overlay").classList.add("visible")}
function closeSidebar(){$("sidebar").classList.remove("open");$("overlay").classList.remove("visible")}
function renderImagePreview(){
const area=$("imagePreview");area.innerHTML="";
pendingImages.forEach((src,i)=>{const item=document.createElement("div");item.className="preview-item";const img=document.createElement("img");img.src=src;img.className="preview-image";const del=document.createElement("button");del.type="button";del.className="remove-image";del.textContent="×";del.onclick=()=>{pendingImages.splice(i,1);renderImagePreview()};item.append(img,del);area.append(item)});
}
$("attach").onclick=()=>$("imageInput").click();
$("imageInput").addEventListener("change",async e=>{
for(const file of Array.from(e.target.files||[])){
if(!["image/jpeg","image/png","image/webp"].includes(file.type)){alert("Formats acceptés : JPG, PNG et WEBP.");continue}
if(file.size>1024*1024){alert("Chaque image doit faire 1 Mo maximum.");continue}
if(pendingImages.length>=3){alert("Maximum 3 images par envoi.");break}
const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});
pendingImages.push(data);
}
e.target.value="";renderImagePreview();
});
async function loadModels(){
try{
const r=await fetch("/api/models",{cache:"no-store"});const d=await r.json();
if(!r.ok)throw Error(d.error||"Chargement impossible");
const list=d.models||[];
if(!list.length)throw Error("Aucun modèle gratuit disponible");
$("model").innerHTML="";
list.forEach(m=>{const op=document.createElement("option");op.value=m.id;op.textContent=m.name||m.id;$("model").append(op)});
$("status").textContent=list.length+" modèles gratuits disponibles";
}catch(e){$("model").innerHTML="<option value=''>Modèles indisponibles</option>";$("status").textContent="Erreur modèles : "+e.message}
}
async function sendMessage(text){
if((!text.trim()&&!pendingImages.length)||busy)return;
const model=$("model").value;if(!model){$("status").textContent="Aucun modèle disponible.";return}
if(!threadId)threadId=String(Date.now());
const userText=text.trim(),images=pendingImages.slice();
const parts=[];if(userText)parts.push({type:"text",text:userText});
images.forEach(url=>parts.push({type:"image_url",image_url:{url}}));
const content=images.length?parts:userText;
$("welcome")?.remove();
const bubble=addMessage("user",userText||"Regarde cette image.");
images.forEach(src=>{const img=document.createElement("img");img.src=src;img.className="attached-image";bubble.append(img)});
messages.push({role:"user",content});
pendingImages=[];renderImagePreview();$("input").value="";$("input").style.height="";
busy=true;$("send").disabled=true;$("attach").disabled=true;$("status").textContent="NOVA analyse ton message…";
const answer=addMessage("assistant","NOVA réfléchit…");
try{
const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model,messages})});
const d=await r.json();if(!r.ok)throw Error(d.error?.message||d.error||"Erreur API");
let result=d.choices?.[0]?.message?.content;if(Array.isArray(result))result=result.map(p=>p.text||"").join("");
if(typeof result!=="string"||!result.trim())throw Error("Réponse vide du modèle.");
answer.innerHTML=renderMarkdown(result);messages.push({role:"assistant",content:result});saveThread();
$("status").textContent=d.nova_fallback?"Modèle de secours : "+(d.nova_model_used||"autre modèle"):"Réponse générée par "+(d.nova_model_used||model);
}catch(e){answer.textContent="Erreur : "+e.message;messages.pop();$("status").textContent="Échec : "+e.message}
finally{busy=false;$("send").disabled=false;$("attach").disabled=false;$("messages").scrollTop=$("messages").scrollHeight}
}
$("form").addEventListener("submit",e=>{e.preventDefault();sendMessage($("input").value)});
$("input").addEventListener("input",e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,160)+"px"});
$("input").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("form").requestSubmit()}});
$("new").onclick=newThread;$("clear").onclick=newThread;$("menu").onclick=openSidebar;$("overlay").onclick=closeSidebar;
$("messages").addEventListener("click",e=>{
const p=e.target.closest("[data-prompt]");if(p){$("input").value=p.dataset.prompt;$("form").requestSubmit()}
const c=e.target.closest("[data-copy-code]");if(c){const code=c.closest(".code-wrap")?.querySelector("code")?.textContent;if(code)copyText(code,c)}
});
try{const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");if(Array.isArray(saved))threads=saved}catch(e){threads=[]}
renderHistory();loadModels();
</script>
</body>
</html>
