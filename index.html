
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d18">
<title>NOVA AI</title>
<style>
:root{--bg:#080d18;--panel:#0d1525;--panel2:#111c30;--line:#273650;--text:#edf3ff;--muted:#91a0b8;--a:#7659ff;--b:#3478ec}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
.app{height:100dvh;display:grid;grid-template-columns:260px minmax(0,1fr);overflow:hidden}
aside{background:#0b1220;border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;min-height:0}
.brand{font-size:23px;font-weight:800;margin:5px 0 24px}
.logo{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:12px;background:linear-gradient(135deg,var(--a),#20c8c8);margin-right:8px}
.primary,.send,.gradient{border:0;background:linear-gradient(120deg,var(--a),var(--b));font-weight:700;border-radius:12px;padding:12px}
.primary{width:100%}
.side-label{color:var(--muted);font-size:11px;letter-spacing:1.2px;margin:23px 0 9px}
#history{overflow:auto;display:grid;gap:7px}
.history-entry{display:flex;gap:5px}
.history-item{flex:1;min-width:0;border:1px solid transparent;background:transparent;text-align:left;padding:10px;border-radius:10px;color:#bdc9dc;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.history-item.active,.history-item:hover{background:var(--panel2);border-color:var(--line)}
.delete-thread{border:0;background:transparent;color:var(--muted);padding:5px}
.side-bottom{margin-top:auto;color:var(--muted);font-size:12px;line-height:1.6}
main{display:flex;flex-direction:column;min-width:0;min-height:0}
header{height:68px;flex-shrink:0;padding:10px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}
.head-left{display:flex;align-items:center;gap:10px}
.head-title{font-weight:800}
.head-sub{color:var(--muted);font-size:12px;margin-top:3px}
select{max-width:min(58%,430px);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px}
#messages{flex:1;overflow:auto;padding:25px 16px}
.welcome{max-width:700px;margin:9vh auto;text-align:center}
.orb{width:72px;height:72px;margin:auto;border-radius:24px;background:linear-gradient(135deg,var(--a),#20c8c8);display:grid;place-items:center;font-size:34px}
.welcome h1{font-size:clamp(25px,4vw,36px);margin:24px 0 10px}
.welcome p{color:var(--muted)}
.suggestions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:24px}
.suggestions button,.tiny,.secondary{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:#c7d2e5}
.msg{display:flex;gap:12px;max-width:900px;margin:0 auto 23px;align-items:flex-start}
.avatar{width:35px;height:35px;flex:0 0 35px;border-radius:10px;background:#263650;display:grid;place-items:center;font-weight:700}
.assistant .avatar{background:linear-gradient(135deg,#5844c9,#1e9da5)}
.message-content{min-width:0;flex:1}
.bubble{overflow-wrap:anywhere;line-height:1.7;padding:5px 0}
.user .bubble{background:#17243a;border:1px solid #2c3e5c;border-radius:13px;padding:12px 14px}
.bubble p{margin:0 0 12px}
.bubble strong{color:white}
.code-wrap{margin:12px 0;background:#080e1a;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.code-head{display:flex;justify-content:space-between;padding:8px 12px;background:#111c30;color:var(--muted);font-size:12px}
pre{overflow:auto;margin:0;padding:14px;white-space:pre;line-height:1.5;font-size:13px}
.msg-actions{display:flex;gap:7px;margin-top:8px}
.msg-actions button,.code-head button{background:transparent;border:1px solid var(--line);border-radius:7px;padding:6px 9px;color:var(--muted);font-size:11px}
.compose{padding:12px max(12px,calc((100% - 900px)/2));border-top:1px solid var(--line);background:#0b1220}
.toolbar{max-width:900px;margin:0 auto 9px;display:flex;justify-content:flex-end;gap:7px;flex-wrap:wrap}
.tiny{font-size:12px}
.status{max-width:900px;margin:0 auto 10px;color:var(--muted);font-size:12px}
form{max-width:900px;margin:auto;display:flex;gap:9px;align-items:flex-end;background:#101827;border:1px solid #34425d;border-radius:16px;padding:9px}
textarea{flex:1;resize:none;background:transparent;border:0;outline:0;color:white;padding:10px;line-height:1.5;min-height:45px;max-height:150px;min-width:0}
.send{width:50px;height:48px;font-size:21px}
.hint{text-align:center;color:#71819c;font-size:11px;margin:8px 0 0}
.mobile-menu{display:none}
#overlay{display:none}
#studio,#timePanel{display:none;position:fixed;z-index:40;inset:0;background:#03070ff2;backdrop-filter:blur(14px);overflow:auto;padding:12px}
#studio.open,#timePanel.open{display:block}
.modal-shell{max-width:1080px;margin:0 auto;border:1px solid #34425d;border-radius:20px;background:linear-gradient(145deg,#101a2c,#080e19);padding:clamp(13px,3vw,25px)}
.modal-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:15px}
.modal-title{font-size:clamp(20px,4vw,27px);font-weight:900}
.modal-title span{background:linear-gradient(90deg,#a48cff,#45d8d1);background-clip:text;color:transparent}
.close{border:1px solid var(--line);background:#17243a;border-radius:9px;padding:9px 12px}
.intro{color:var(--muted);line-height:1.55;font-size:13px}
.studio-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.panel{background:#0b1424;border:1px solid var(--line);border-radius:14px;padding:15px;min-width:0}
.panel h3{margin:0 0 12px;font-size:15px}
.mode-switch,.two,.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mode-switch button,.actions button{border:1px solid var(--line);background:#142139;border-radius:9px;padding:10px}
.mode-switch button.active{background:#282052;border-color:#8069ff}
.field{display:grid;gap:6px;margin:12px 0}
.field label{font-size:12px;color:#bdc9dc;font-weight:700}
.field textarea,.field input,.field select{width:100%;max-width:none;background:#111c30;border:1px solid #34425d;border-radius:9px;color:white;padding:10px}
.field textarea{min-height:95px}
.field small,.note{font-size:11px;color:var(--muted);line-height:1.5}
.studio-primary{width:100%;margin-top:8px}
.preview{background:#050912;border:1px solid #33435e;border-radius:12px;overflow:hidden;position:relative;display:grid;place-items:center;min-height:220px}
#videoCanvas{display:block;width:100%;height:auto;max-height:440px}
.placeholder{position:absolute;text-align:center;color:#8797b1;pointer-events:none}
.placeholder b{display:block;font-size:35px;color:#b4a5ff}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin:9px 0}
.actions{margin-top:10px}
.actions button:disabled{opacity:.4}
#studioStatus,#timeStatus{min-height:20px;color:#b7aaff;font-size:12px;margin-top:9px}
.time-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.time-card{background:#0b1424;border:1px solid var(--line);border-radius:14px;padding:16px}
.time-big{font-size:clamp(22px,5vw,34px);font-weight:850;margin:8px 0}
.time-muted{color:var(--muted);font-size:12px;line-height:1.6}
.date-result{padding:12px;border:1px solid var(--line);border-radius:10px;background:#111c30;margin-top:10px;line-height:1.6}
.status-good{color:#73e2b9}
.status-future{color:#9f91ff}
.status-past{color:#ffc17e}
@media(max-width:760px){
.app{display:block}
aside{position:fixed;z-index:20;top:0;bottom:0;left:0;width:min(290px,85vw);transform:translateX(-105%);transition:.2s}
aside.open{transform:translateX(0)}
#overlay{display:block;position:fixed;inset:0;background:#0009;z-index:19;opacity:0;pointer-events:none}
#overlay.visible{opacity:1;pointer-events:auto}
main{height:100dvh}
header{height:65px;padding:9px 11px}
.mobile-menu{display:block;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
select{max-width:54%;font-size:11px;padding:9px}
#messages{padding:16px 12px}
.msg{gap:8px}
.compose{padding:9px 10px calc(9px + env(safe-area-inset-bottom))}
.studio-grid,.time-grid{grid-template-columns:1fr}
.preview{min-height:170px}
.modal-shell{padding:12px;border-radius:14px}
.two{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="overlay"></div>
<div class="app">
<aside id="sidebar">
<div class="brand"><span class="logo">N</span>NOVA AI</div>
<button class="primary" id="new">＋ Nouvelle conversation</button>
<div class="side-label">HISTORIQUE</div>
<div id="history"></div>
<div class="side-bottom">NOVA AI<br>Réfléchir · créer · apprendre<br><br>Historique enregistré sur cet appareil.</div>
</aside>
<main>
<header>
<div class="head-left">
<button class="mobile-menu" id="menu">☰</button>
<div><div class="head-title">NOVA AI</div><div class="head-sub">Votre espace intelligent</div></div>
</div>
<select id="model"><option value="">Chargement des modèles…</option></select>
</header>
<section id="messages">
<div class="welcome" id="welcome">
<div class="orb">✦</div>
<h1>Que veux-tu créer aujourd'hui ?</h1>
<p>Pose une question, imagine un projet ou demande de l'aide.</p>
<div class="suggestions">
<button data-prompt="Explique-moi un sujet compliqué simplement.">Apprendre</button>
<button data-prompt="Aide-moi à imaginer un projet original et détaillé.">Créer un projet</button>
<button data-prompt="Aide-moi à écrire un texte professionnel.">Rédiger</button>
</div>
</div>
</section>
<div class="compose">
<div class="toolbar">
<button class="tiny" id="openTime">📍 Localisation & temps</button>
<button class="tiny" id="openStudio">✦ NOVA VIDEO STUDIO</button>
<button class="tiny" id="clear">Effacer la conversation</button>
</div>
<div class="status" id="status"></div>
<form id="form">
<input id="imageInput" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden>
<button type="button" class="tiny" id="attach">📎</button>
<textarea id="input" rows="1" placeholder="Écris ton message à NOVA AI…"></textarea>
<button class="send" id="send" type="submit">➤</button>
</form>
<div id="imagePreview"></div>
<div class="hint">Modèles gratuits uniquement · Une IA peut se tromper.</div>
</div>
</main>
</div>

<!-- Le reste du fichier complet est disponible dans le téléchargement ci-dessous. -->
</body>
</html>
